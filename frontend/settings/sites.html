<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sites · Settings · Super Inspections</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="/">Super Inspections</a>
      </div>
    </header>

    <main>
      <section class="app-section">
        <div class="container app-grid">
          <div>
            <a class="back-link" href="/settings.html">&larr; Settings</a>
            <div class="card">
              <h2>Create a site</h2>
              <form id="site-form">
                <label for="site-name">Name</label>
                <input id="site-name" type="text" placeholder="e.g. Downtown Store" required />

                <button type="submit" class="btn btn-primary">Create site</button>
                <p id="site-form-message" class="form-message"></p>
              </form>
            </div>
          </div>

          <div class="card">
            <h2>Sites</h2>
            <ul id="site-list" class="settings-list">
              <li class="empty">Loading...</li>
            </ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span id="api-status">Checking API status…</span>
      </div>
    </footer>

    <script type="module" src="/src/sites.js"></script>
  </body>
</html>
