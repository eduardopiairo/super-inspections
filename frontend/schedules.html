<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedules · Super Inspections</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="/">Super Inspections</a>
      </div>
    </header>

    <main>
      <section class="app-section">
        <div class="container app-grid">
          <div>
            <a class="back-link" href="/">&larr; Back to app</a>
            <div class="card">
              <h2>Create a schedule</h2>
              <form id="schedule-form">
                <label for="schedule-template">Template</label>
                <select id="schedule-template" required>
                  <option value="" disabled selected>Select a template…</option>
                </select>

                <label for="schedule-frequency">Frequency</label>
                <select id="schedule-frequency">
                  <option value="once">Once</option>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                </select>

                <label for="schedule-start-date">Start date</label>
                <input id="schedule-start-date" type="date" required />

                <label for="schedule-site">Site</label>
                <select id="schedule-site">
                  <option value="">No site</option>
                </select>

                <label for="schedule-user">Assigned to</label>
                <select id="schedule-user">
                  <option value="">Unassigned</option>
                </select>

                <button type="submit" class="btn btn-primary">Create schedule</button>
                <p id="schedule-form-message" class="form-message"></p>
              </form>
            </div>
          </div>

          <div class="card">
            <h2>Schedules</h2>
            <ul id="schedule-list" class="schedule-list">
              <li class="empty">Loading...</li>
            </ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span id="api-status">Checking API status…</span>
      </div>
    </footer>

    <script type="module" src="/src/schedules.js"></script>
  </body>
</html>
