name: pipeline-lint

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: pipeline-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install actionlint-py==1.7.12.25 zizmor==1.32.0

      # Syntax, expression and shell errors in workflow files.
      - name: actionlint
        run: actionlint

      # Workflow security: unpinned actions, missing permissions, injection risks.
      - name: zizmor
        run: zizmor --format plain .github
